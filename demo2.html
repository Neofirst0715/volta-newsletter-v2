<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volta Newsletter — Link Desk</title>
<style>
  :root {
    --paper: #EFEDE6;
    --card: #FFFFFF;
    --ink: #21201C;
    --ink-soft: #6B6558;
    --line: #D9D4C7;
    --accent: #8A5A2B;
    --accent-soft: #F1E4D4;
    --spotlight: #8A5A2B;
    --event: #2F6B65;
    --other: #8B8577;
    --danger: #A5433A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  header {
    padding: 22px 32px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  header h1 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 22px;
    font-weight: 600;
    margin: 0;
  }

  .campaign-tag {
    font-size: 13px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .campaign-tag strong {
    color: var(--ink);
    font-weight: 600;
  }

  .campaign-tag input[type="date"] {
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 5px 8px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
    background: var(--card);
  }

  .campaign-tag input[type="date"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  main {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 0;
    min-height: calc(100vh - 68px);
  }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
  }

  section.form-panel {
    padding: 28px 32px;
    border-right: 1px solid var(--line);
  }

  section.queue-panel {
    padding: 28px 32px;
  }

  h2 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 18px 0;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 16px 0 6px 0;
  }

  label:first-of-type { margin-top: 0; }

  input[type="text"], input[type="url"] {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--card);
    color: var(--ink);
    font-size: 14px;
    font-family: inherit;
  }

  input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .radio-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .radio-option {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
  }

  .radio-option input { accent-color: var(--accent); }

  .hint {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  button.primary {
    margin-top: 22px;
    width: 100%;
    padding: 11px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 3px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  button.primary:hover { background: var(--accent); }

  .error {
    color: var(--danger);
    font-size: 13px;
    margin-top: 10px;
    display: none;
  }

  .queue-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .queue-actions {
    display: flex;
    gap: 8px;
  }

  .queue-actions button {
    padding: 7px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 3px;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink);
    font-family: inherit;
  }

  .queue-actions button:hover { border-color: var(--ink); }

  .empty-state {
    border: 1px dashed var(--line);
    border-radius: 4px;
    padding: 32px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .queue-item {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--other);
    border-radius: 3px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }

  .queue-item.founder_spotlight { border-left-color: var(--spotlight); }
  .queue-item.community_event { border-left-color: var(--event); }
  .queue-item.other { border-left-color: var(--other); }

  .queue-item-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .queue-item-title {
    font-weight: 600;
    font-size: 14px;
  }

  .queue-item-meta {
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .queue-item-block {
    margin-top: 10px;
    padding: 8px 10px;
    background: var(--paper);
    border-radius: 3px;
    font-size: 12.5px;
    word-break: break-all;
    color: var(--ink);
  }

  .queue-item-actions {
    margin-top: 10px;
    display: flex;
    gap: 8px;
  }

  .queue-item-actions button {
    padding: 5px 10px;
    font-size: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 3px;
    cursor: pointer;
    color: var(--ink);
    font-family: inherit;
  }

  .queue-item-actions button.remove { color: var(--danger); border-color: var(--danger); }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--paper);
    padding: 10px 18px;
    border-radius: 4px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<header>
  <h1>Volta Newsletter — Link Desk</h1>
  <div class="campaign-tag">
    Send date:
    <input type="date" id="sendDateInput">
    <span>→ utm_campaign: <strong id="campaignTag"></strong></span>
  </div>
</header>

<main>
  <section class="form-panel">
    <h2>Add a link</h2>

    <label for="titleInput">Headline text</label>
    <input type="text" id="titleInput" placeholder="e.g. Jane launches her new site">

    <label for="urlInput">Destination URL</label>
    <input type="url" id="urlInput" placeholder="https://...">

    <label>Section</label>
    <div class="radio-group">
      <div class="radio-option">
        <input type="radio" name="module" id="mod-spotlight" value="founder_spotlight" checked>
        <label for="mod-spotlight" style="margin:0; color:var(--ink); font-size:14px;">Founder spotlight</label>
      </div>
      <div class="radio-option">
        <input type="radio" name="module" id="mod-event" value="community_event">
        <label for="mod-event" style="margin:0; color:var(--ink); font-size:14px;">Community event</label>
      </div>
      <div class="radio-option">
        <input type="radio" name="module" id="mod-other" value="other">
        <label for="mod-other" style="margin:0; color:var(--ink); font-size:14px;">Other</label>
      </div>
    </div>

    <label for="labelInput">Specific label</label>
    <input type="text" id="labelInput" placeholder="e.g. jane_doe or fall_hackathon">
    <div class="hint">Used to tell this link apart from others in the same section once it's in Mailchimp's click reports.</div>

    <div class="error" id="errorMsg"></div>

    <button class="primary" id="addBtn">Add to issue</button>
  </section>

  <section class="queue-panel">
    <div class="queue-header">
      <h2 style="margin:0;">This issue</h2>
      <div class="queue-actions">
        <button id="copyAllBtn">Copy all</button>
        <button id="downloadBtn">Download as .txt</button>
      </div>
    </div>

    <div id="queueList">
      <div class="empty-state" id="emptyState">No links added yet. Fill in the form on the left and add your first one.</div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
  const queue = [];
  let idCounter = 0;

  const moduleLabels = {
    founder_spotlight: 'Founder spotlight',
    community_event: 'Community event',
    other: 'Other'
  };

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function todayLocalISO() {
    const now = new Date();
    return now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
  }

  function getCampaignTag() {
    const dateInput = document.getElementById('sendDateInput');
    const value = dateInput && dateInput.value ? dateInput.value : todayLocalISO();
    return value.replace(/-/g, '_');
  }

  function refreshCampaignTagDisplay() {
    document.getElementById('campaignTag').textContent = getCampaignTag();
  }

  function slugify(str) {
    return str
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '_')
      .replace(/^_+|_+$/g, '');
  }

  function buildTaggedUrl(rawUrl, moduleType, label) {
    let normalized = rawUrl.trim();
    if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(normalized)) {
      normalized = 'https://' + normalized;
    }
    const url = new URL(normalized);
    const campaign = getCampaignTag();
    const content = moduleType + '_' + slugify(label);
    url.searchParams.set('utm_source', 'volta_newsletter');
    url.searchParams.set('utm_medium', 'email');
    url.searchParams.set('utm_campaign', campaign);
    url.searchParams.set('utm_content', content);
    return url.toString();
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function clearError() {
    const el = document.getElementById('errorMsg');
    el.style.display = 'none';
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1600);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  function blockText(item) {
    return item.title + ': ' + item.taggedUrl;
  }

  function renderQueue() {
    const list = document.getElementById('queueList');
    const emptyState = document.getElementById('emptyState');

    if (queue.length === 0) {
      list.innerHTML = '';
      list.appendChild(emptyState);
      return;
    }

    list.innerHTML = '';
    queue.forEach(item => {
      const card = document.createElement('div');
      card.className = 'queue-item ' + item.moduleType;

      card.innerHTML = `
        <div class="queue-item-top">
          <div>
            <div class="queue-item-title"></div>
            <div class="queue-item-meta"></div>
          </div>
        </div>
        <div class="queue-item-block"></div>
        <div class="queue-item-actions">
          <button class="copy-item">Copy</button>
          <button class="remove">Remove</button>
        </div>
      `;

      card.querySelector('.queue-item-title').textContent = item.title;
      card.querySelector('.queue-item-meta').textContent =
        moduleLabels[item.moduleType] + ' · utm_content=' + item.moduleType + '_' + slugify(item.label);
      card.querySelector('.queue-item-block').textContent = blockText(item);

      card.querySelector('.copy-item').addEventListener('click', () => {
        copyText(blockText(item));
        showToast('Copied');
      });

      card.querySelector('.remove').addEventListener('click', () => {
        const idx = queue.findIndex(q => q.id === item.id);
        if (idx > -1) queue.splice(idx, 1);
        renderQueue();
      });

      list.appendChild(card);
    });
  }

  document.getElementById('addBtn').addEventListener('click', () => {
    clearError();
    const title = document.getElementById('titleInput').value.trim();
    const rawUrl = document.getElementById('urlInput').value.trim();
    const moduleType = document.querySelector('input[name="module"]:checked').value;
    const label = document.getElementById('labelInput').value.trim();

    if (!title) { showError('Add a headline for this link.'); return; }
    if (!rawUrl) { showError('Add a destination URL.'); return; }
    if (!label) { showError('Add a specific label so this link can be told apart from others in the same section.'); return; }

    let taggedUrl;
    try {
      taggedUrl = buildTaggedUrl(rawUrl, moduleType, label);
    } catch (e) {
      showError('That URL doesn\'t look valid. Double-check it and try again.');
      return;
    }

    queue.push({
      id: idCounter++,
      title,
      moduleType,
      label,
      taggedUrl
    });

    document.getElementById('titleInput').value = '';
    document.getElementById('urlInput').value = '';
    document.getElementById('labelInput').value = '';
    document.getElementById('titleInput').focus();

    renderQueue();
  });

  document.getElementById('copyAllBtn').addEventListener('click', () => {
    if (queue.length === 0) { showToast('Nothing to copy yet'); return; }
    const all = queue.map(blockText).join('\n\n');
    copyText(all);
    showToast('Copied ' + queue.length + ' link' + (queue.length > 1 ? 's' : ''));
  });

  document.getElementById('downloadBtn').addEventListener('click', () => {
    if (queue.length === 0) { showToast('Nothing to download yet'); return; }
    const all = queue.map(blockText).join('\n\n');
    const blob = new Blob([all], { type: 'text/plain' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'volta-newsletter-links-' + getCampaignTag() + '.txt';
    link.click();
    URL.revokeObjectURL(link.href);
  });

  const sendDateInput = document.getElementById('sendDateInput');
  sendDateInput.value = todayLocalISO();
  sendDateInput.addEventListener('input', refreshCampaignTagDisplay);
  refreshCampaignTagDisplay();
</script>

</body>
</html>
